packages:
  - 'website'

allowBuilds:
  '@nestjs/core': false
  core-js: false
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  ssh2: false

# Security floors for transitive deps (Dependabot advisories). Drop an entry
# once the parent chain resolves a patched version on its own.
overrides:
  vite: ^8.2.4
  'tinypool@<2.1.2': ^2.2.0
  'minimatch@>=9.0.0 <9.0.7': ^10.2.6
  'katex@<0.18.2': ^0.18.2
  'postcss-selector-parser@<7.1.6': ^7.1.7
  'uuid@<11.1.1': ^11.1.1
  'yaml@>=2.0.0 <2.8.3': ^2.8.3
  'qs@>=6.11.1 <6.15.2': 6.15.3
  ws: ^8.21.3
  'serialize-javascript@>=5.0.0 <7.0.5': ^7.1.0
