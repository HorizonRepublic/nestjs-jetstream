<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    /* Browser chrome gives no page CSS, so the mark carries its own: ink on a
       light tab bar, paper on a dark one. The accent square holds either way. */
    .ink { stroke: #232936; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e8ebf2; }
    }
  </style>
  <g class="ink" fill="none" stroke-linecap="square">
    <path d="M7 11 H21" stroke-width="3"></path>
    <path d="M4 16.5 H21" stroke-width="3"></path>
    <path d="M7 22 H16" stroke-width="3"></path>
  </g>
  <rect x="20" y="18" width="8.5" height="8.5" fill="#2c5fb3"></rect>
</svg>
