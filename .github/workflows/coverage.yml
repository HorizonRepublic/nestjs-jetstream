name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Lint markdown
        run: pnpm lint:md

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Run all tests with coverage
        run: pnpm test:cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

  # Development runs on the newest NestJS major. peerDependencies also accept
  # the older majors, so each of them gets the full suite: typecheck, build,
  # unit and integration tests.
  nestjs-compat:
    name: NestJS ${{ matrix.nestjs }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        nestjs: [10, 11]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Install dependencies
        run: pnpm install

      - name: Install NestJS ${{ matrix.nestjs }}
        run: >
          pnpm add -D
          @nestjs/common@^${{ matrix.nestjs }}
          @nestjs/core@^${{ matrix.nestjs }}
          @nestjs/microservices@^${{ matrix.nestjs }}
          @nestjs/platform-express@^${{ matrix.nestjs }}
          @nestjs/testing@^${{ matrix.nestjs }}

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The tests run the sources; this loads what is published, in both formats.
      - name: Load the built package
        run: |
          node -e "require('./dist/index.cjs')"
          node --input-type=module -e "await import('./dist/index.js')"

      - name: Run all tests
        run: pnpm test
